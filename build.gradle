plugins {
    id 'net.neoforged.moddev' version '2.0.78'
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'epicscorch-reforged'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet project.sourceSets.main
        }
    }
}

repositories {
    maven {
        url = "https://cursemaven.com"
    }
    maven {
        url = "https://maven.neoforged.net/releases"
    }
    mavenCentral()
}

dependencies {
    implementation "curse.maven:epic-fight-mod-405076:8175609"
    implementation "curse.maven:scorched-guns-neoforged-1538807:8299074"
    implementation "curse.maven:framework-549225:7530361"
    implementation "curse.maven:curios-309927:6529130"
    implementation "curse.maven:geckolib-388172:8350073"
    implementation "curse.maven:shoulder-surfing-reloaded-243190:9013811"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_license: mod_license,
            mod_url: mod_url
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "MixinConfigs": "epicscorch.mixins.json"
        ])
    }
}

